<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h2 align="center"> Register</h2>

    <form>
        <fieldset>
        <p align="center">
        Kindly fill in this form in register</p><br>

        <label>UserName:</label><br>
        <input type="text" name="fullname" placeholder="Enter your name"><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email"><br>

        <label>Password:</label><br>
        <input type="password" name="password" placeholder="Enter password"><br>

        <label>Repeat Paswword</label><br>
        <input type="tel" name="password" placeholder="Enter Password"><br>

        <label for=""> Birth date</label>
        <input type="date">
        <br>

        <label>Course:</label><br>
        <select name="course">
            <option>Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>
        <br>

        <input type="submit" value="Register">
        <p align="center">
        Already have an account?
        <a href="login.html">Login in</a>
        </p>
        

        </fieldset>

    </form>
    <style> 
    form{
    width:450px;
    margin:auto;
    }
    </style>

</body>
</html>
